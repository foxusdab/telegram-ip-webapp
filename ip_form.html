<!-- Файл: https://foxusdab.github.io/telegram-ip-webapp/ip_form.html -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Отримуємо user_id
    const user = tg.initDataUnsafe?.user;
    if (!user) {
        document.body.innerHTML = "<h2>❌ Не вдалося отримати дані користувача</h2>";
        return;
    }

    // Відправляємо дані
    fetch('https://yourdomain.com/api/track', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            user_id: user.id,
            phone_verified: true
        })
    })
    .then(res => res.json())
    .then(data => {
        alert("✅ IP-адреса успішно зареєстрована!");
    })
    .catch(err => {
        alert("❌ Помилка трекінгу: " + err.message);
    });
});
</script>
